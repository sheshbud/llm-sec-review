name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Schema tests (no API key needed)
        run: python -m unittest discover -s tests -v
      - name: Install Semgrep
        run: pipx install semgrep
      - name: Semgrep baseline over the benchmark
        run: python -m llmsec.cli baseline
